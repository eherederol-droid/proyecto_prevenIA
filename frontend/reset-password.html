<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrevenIA — Crear nueva contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-hero">
      <div class="auth-hero-content">
        <div class="auth-hero-logo">
          <img class="brand-image" src="../logo_prevenIA.png" alt="PrevenIA">
        </div>
        <h1>Protege tu cuenta</h1>
        <p>Elige una contraseña nueva y segura para continuar usando PrevenIA.</p>
      </div>
    </section>
    <section class="auth-form-container">
      <div class="auth-form-box">
        <img class="brand-image mobile-brand" src="../logo_prevenIA.png" alt="PrevenIA">
        <h2>Crear nueva contraseña</h2>
        <p>La nueva contraseña debe cumplir los requisitos de seguridad.</p>
        <div id="reset-message" class="alert hidden mb-4" role="status" aria-live="polite"></div>
        <form id="reset-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="new-password">Nueva contraseña</label>
            <input type="password" id="new-password" class="form-control" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password-confirm">Confirmar nueva contraseña</label>
            <input type="password" id="password-confirm" class="form-control" autocomplete="new-password" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-btn">Guardar nueva contraseña</button>
        </form>
        <div class="divider"></div>
        <p class="text-sm text-center" style="color:var(--gray-500)">
          <a href="login.html" class="text-primary font-semibold">Volver a iniciar sesión</a>
        </p>
      </div>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script>
    const parameters = new URLSearchParams(window.location.search);
    const uid = parameters.get('uid') || '';
    const token = parameters.get('token') || '';
    const form = document.getElementById('reset-form');
    const button = document.getElementById('reset-btn');
    const message = document.getElementById('reset-message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `alert alert-${type} mb-4`;
    }

    if (!uid || !token) {
      form.classList.add('hidden');
      showMessage('El enlace de recuperación está incompleto. Solicita uno nuevo.', 'danger');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.className = 'alert hidden mb-4';
      const password = document.getElementById('new-password').value;
      const confirmation = document.getElementById('password-confirm').value;
      if (password.length < 8) {
        showMessage('La contraseña debe tener al menos 8 caracteres.', 'danger');
        return;
      }
      if (password !== confirmation) {
        showMessage('Las contraseñas no coinciden.', 'danger');
        return;
      }
      button.disabled = true;
      button.textContent = 'Actualizando...';
      try {
        const response = await api.confirmPasswordReset(uid, token, password, confirmation);
        showMessage(response.detail, 'success');
        form.classList.add('hidden');
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (requestError) {
        let text = requestError.message;
        try {
          const detail = JSON.parse(text);
          text = detail.detail || Object.values(detail).flat().join(' ');
        } catch {}
        showMessage(text, 'danger');
      } finally {
        button.disabled = false;
        button.textContent = 'Guardar nueva contraseña';
      }
    });
  </script>
</body>
</html>
