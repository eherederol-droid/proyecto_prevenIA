<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrevenIA — Recuperar contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-hero">
      <div class="auth-hero-content">
        <div class="auth-hero-logo">
          <img class="brand-image" src="../logo_prevenIA.png" alt="PrevenIA">
        </div>
        <h1>Recupera el acceso a tu cuenta</h1>
        <p>Te enviaremos un enlace seguro para crear una nueva contraseña.</p>
      </div>
    </section>
    <section class="auth-form-container">
      <div class="auth-form-box">
        <img class="brand-image mobile-brand" src="../logo_prevenIA.png" alt="PrevenIA">
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>Ingresa el correo asociado a tu cuenta y te enviaremos instrucciones.</p>
        <div id="request-message" class="alert hidden mb-4" role="status" aria-live="polite"></div>
        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reset-email">Correo electrónico</label>
            <input type="email" id="reset-email" class="form-control" placeholder="correo@ejemplo.com" autocomplete="email" required>
            <span id="email-error" class="form-error hidden"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="request-btn">Enviar enlace de recuperación</button>
        </form>
        <div class="divider"></div>
        <p class="text-sm text-center" style="color:var(--gray-500)">
          <a href="login.html" class="text-primary font-semibold">Volver a iniciar sesión</a>
        </p>
      </div>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const button = document.getElementById('request-btn');
    const message = document.getElementById('request-message');
    const emailInput = document.getElementById('reset-email');
    const error = document.getElementById('email-error');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      error.classList.add('hidden');
      message.className = 'alert hidden mb-4';
      const email = emailInput.value.trim();
      if (!emailInput.validity.valid || !email) {
        error.textContent = 'Ingresa un correo electrónico válido.';
        error.classList.remove('hidden');
        emailInput.classList.add('is-invalid');
        return;
      }
      emailInput.classList.remove('is-invalid');
      button.disabled = true;
      button.textContent = 'Enviando...';
      try {
        const response = await api.requestPasswordReset(email);
        message.textContent = response.detail;
        message.classList.remove('hidden');
        message.classList.add('alert-success');
        form.reset();
      } catch (requestError) {
        let text = requestError.message;
        try {
          const detail = JSON.parse(text);
          text = detail.detail || Object.values(detail).flat().join(' ');
        } catch {}
        message.textContent = text;
        message.classList.remove('hidden');
        message.classList.add('alert-danger');
      } finally {
        button.disabled = false;
        button.textContent = 'Enviar enlace de recuperación';
      }
    });
  </script>
</body>
</html>
